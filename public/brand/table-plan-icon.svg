<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <title>Table Plan</title>
  <defs>
    <radialGradient id="g1"><stop offset="0" stop-color="#289670" stop-opacity=".55"/><stop offset="1" stop-color="#289670" stop-opacity="0"/></radialGradient>
    <radialGradient id="g2"><stop offset="0" stop-color="#325AC8" stop-opacity=".5"/><stop offset="1" stop-color="#325AC8" stop-opacity="0"/></radialGradient>
    <radialGradient id="g3"><stop offset="0" stop-color="#A05A32" stop-opacity=".34"/><stop offset="1" stop-color="#A05A32" stop-opacity="0"/></radialGradient>
    <radialGradient id="g4"><stop offset="0" stop-color="#6E46BE" stop-opacity=".4"/><stop offset="1" stop-color="#6E46BE" stop-opacity="0"/></radialGradient>
    <linearGradient id="glassT" gradientUnits="userSpaceOnUse" x1="0" y1="543" x2="0" y2="843"><stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#CBD3D8"/></linearGradient>
    <linearGradient id="glassP" gradientUnits="userSpaceOnUse" x1="0" y1="229" x2="0" y2="465"><stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#CBD3D8"/></linearGradient>
    <linearGradient id="ringG" gradientUnits="userSpaceOnUse" x1="341" y1="518" x2="683" y2="176"><stop offset="0" stop-color="#4CD48F"/><stop offset=".5" stop-color="#6CC3FF"/><stop offset="1" stop-color="#B79CFF"/></linearGradient>
    <filter id="fT" x="-30%" y="-30%" width="160%" height="170%" color-interpolation-filters="sRGB">
      <feGaussianBlur in="SourceAlpha" stdDeviation="22" result="b"/>
      <feOffset in="b" dy="22" result="o"/>
      <feFlood flood-color="#000" flood-opacity="0.55"/>
      <feComposite in2="o" operator="in" result="drop"/>
      <feComponentTransfer in="SourceAlpha" result="inv"><feFuncA type="table" tableValues="1 0"/></feComponentTransfer>
      <feGaussianBlur in="inv" stdDeviation="1"/>
      <feOffset dy="3" result="io"/>
      <feFlood flood-color="#fff" flood-opacity="0.95"/>
      <feComposite in2="io" operator="in"/>
      <feComposite in2="SourceAlpha" operator="in" result="edge"/>
      <feMerge><feMergeNode in="drop"/><feMergeNode in="SourceGraphic"/><feMergeNode in="edge"/></feMerge>
    </filter>
    <filter id="fP" x="-30%" y="-30%" width="160%" height="170%" color-interpolation-filters="sRGB">
      <feGaussianBlur in="SourceAlpha" stdDeviation="14" result="b"/>
      <feOffset in="b" dy="12" result="o"/>
      <feFlood flood-color="#000" flood-opacity="0.45"/>
      <feComposite in2="o" operator="in" result="drop"/>
      <feComponentTransfer in="SourceAlpha" result="inv"><feFuncA type="table" tableValues="1 0"/></feComponentTransfer>
      <feGaussianBlur in="inv" stdDeviation="1"/>
      <feOffset dy="3" result="io"/>
      <feFlood flood-color="#fff" flood-opacity="0.95"/>
      <feComposite in2="io" operator="in"/>
      <feComposite in2="SourceAlpha" operator="in" result="edge"/>
      <feMerge><feMergeNode in="drop"/><feMergeNode in="SourceGraphic"/><feMergeNode in="edge"/></feMerge>
    </filter>
    <filter id="fR" x="-30%" y="-30%" width="160%" height="170%" color-interpolation-filters="sRGB">
      <feGaussianBlur in="SourceAlpha" stdDeviation="15" result="b"/>
      <feOffset in="b" dy="14" result="o"/>
      <feFlood flood-color="#000" flood-opacity="0.4"/>
      <feComposite in2="o" operator="in" result="drop"/>
      <feMerge><feMergeNode in="drop"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1024" height="1024" fill="#05090A"/>
  <ellipse cx="105" cy="5" rx="575" ry="475" fill="url(#g1)"/>
  <ellipse cx="1005" cy="95" rx="525" ry="425" fill="url(#g2)"/>
  <ellipse cx="855" cy="1025" rx="525" ry="425" fill="url(#g3)"/>
  <ellipse cx="5" cy="985" rx="475" ry="425" fill="url(#g4)"/>
  <g filter="url(#fT)" fill="url(#glassT)">
    <rect x="212" y="543" width="600" height="100" rx="34"/>
    <rect x="465" y="593" width="94" height="250" rx="34"/>
  </g>
  <circle cx="512" cy="347" r="171" fill="none" stroke="url(#ringG)" stroke-width="50" filter="url(#fR)"/>
  <circle cx="512" cy="347" r="118" fill="url(#glassP)" filter="url(#fP)"/>
  <circle cx="512" cy="347" r="116.5" fill="none" stroke="#fff" stroke-opacity=".55" stroke-width="3"/>
</svg>
