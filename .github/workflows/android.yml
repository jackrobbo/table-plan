# Builds the Android debug APK on GitHub's servers (they have the JDK and Android SDK). Run it from the Actions tab
# ("Android APK" → Run workflow) or with `gh workflow run android.yml`. The APK is attached to the run as an artifact.
name: Android APK
on: workflow_dispatch

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: android-actions/setup-android@v3
      - run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - run: npm ci
      - run: npm run android:build
      - uses: actions/upload-artifact@v4
        with:
          name: table-plan-apk
          path: public/app/table-plan.apk
          retention-days: 30
