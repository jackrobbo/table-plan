name: Refresh Morrisons prices
on:
  # Scheduled runs are off: Morrisons answers GitHub's servers with HTTP 403 (checked 25 Oct 2026), so a schedule would only fail
  # and email. Prices are refreshed from somewhere Morrisons allows (see design/tomorrow.md). Run by hand to re-test.
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: prices
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run prices:refresh
      - run: npm run content:import
      # Fresh prices change costs and budget tiers, which the planner tests rely on. Never publish prices that break them:
      # the run goes red (GitHub emails the repo owner) and nothing is committed.
      - run: npm run typecheck
      - run: npm test
      - name: Commit if changed
        run: |
          git config user.name "table-plan-bot"
          git config user.email "bot@users.noreply.github.com"
          git add content/prices.json src/data supabase/seed.sql
          git diff --cached --quiet || (git commit -m "chore: refresh Morrisons prices" && git push)
